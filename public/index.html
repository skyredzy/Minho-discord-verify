<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minho • Discord Verification</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 15% 10%,#5865f233,transparent 34%),radial-gradient(circle at 85% 90%,#8b5cf622,transparent 35%),#090a0f;color:#fff;display:grid;place-items:center;padding:24px;overflow:hidden}
.bg{position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent,#ffffff03,transparent);animation:shine 8s linear infinite}@keyframes shine{to{transform:translateX(100%)}}.card{position:relative;width:min(500px,100%);padding:38px;border:1px solid #ffffff18;border-radius:28px;background:#11131be8;backdrop-filter:blur(20px);box-shadow:0 30px 100px #0009;text-align:center}.logo{width:82px;height:82px;border-radius:25px;margin:0 auto 20px;background:linear-gradient(135deg,#5865f2,#7c3aed);display:grid;place-items:center;font-size:38px;font-weight:950;box-shadow:0 15px 45px #5865f255}h1{font-size:30px;margin:0 0 10px}p{color:#aeb4c4;line-height:1.7;margin:0}.features{display:grid;gap:10px;margin:25px 0;text-align:left}.feature{padding:13px 15px;border-radius:14px;background:#ffffff06;border:1px solid #ffffff0d;color:#cdd2df;font-size:14px}.feature b{color:#fff}.btn{display:block;padding:15px 18px;border-radius:14px;background:#5865f2;color:#fff;text-decoration:none;font-weight:850;box-shadow:0 10px 28px #5865f233;transition:.2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.foot{margin-top:18px;color:#676e80;font-size:12px}
</style></head>
<body><div class="bg"></div><main class="card">
<div class="logo">M</div>
<h1>ยืนยันตัวตน Discord</h1>
<p>เชื่อมบัญชี Discord ของมึงเพื่อรับยศ <strong>Verified</strong> ในเซิร์ฟเวอร์</p>
<div class="features">
<div class="feature">🔒 <b>ปลอดภัย</b> — ใช้ Discord OAuth2 ไม่ต้องกรอกรหัสผ่านให้เว็บ</div>
<div class="feature">⚡ <b>อัตโนมัติ</b> — ยืนยันเสร็จแล้วบอทแจกยศทันที</div>
<div class="feature">🛡️ <b>ตรวจสมาชิก</b> — ต้องอยู่ในเซิร์ฟเวอร์ก่อนจึงจะยืนยันได้</div>
</div>
<a class="btn" href="/verify">ยืนยันด้วย Discord</a>
<div class="foot">Minho Discord • Verification System</div>
</main></body></html>
